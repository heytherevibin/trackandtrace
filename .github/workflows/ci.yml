# Checks every pull request into main and every push to main.
# No secrets: every test runs on the sample-data fixture.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    # 30, from 20, because the suite outgrew the old number on 2026-09-27 and the job started being
    # KILLED rather than failing. The landing-journey specs (#72, #73) took the traveller suite from
    # 317 to 490, and the console suite's two minutes then had nowhere to run — it was cancelled
    # mid-step, which reads in the checks list exactly like a test failure and is not one.
    #
    # **The variance is the reason for the margin, not the mean.** Three measured runs of the
    # traveller suite: 6.1 minutes at 317 specs, then 9.8 and 14.9 at 490 — the same specs, a
    # 50% spread, on whichever runner the job lands. 20 minutes fitted the good runs and killed the
    # bad ones, which is the worst way for a limit to be wrong: it fails on the days the machine is
    # slow and never on the days anything is actually broken.
    #
    # This buys room; it does not answer the question. The honest fix is to run the two suites in
    # parallel, or to shard the traveller one — both of which change how the journey specs are
    # grouped, so they belong to whoever owns those specs rather than to a timeout.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start the local Supabase stack
        run: npx supabase@2.117.0 start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Database tests
        run: npx supabase@2.117.0 test db
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test
      # The console suite resets `console.members` between specs through psql, because
      # `console.create_first_owner_link` refuses to issue a second link while an Owner exists.
      # ubuntu-24.04 ships PostgreSQL 16's client tools, so this is normally a no-op — but an
      # implicit dependency on the runner image's contents is worth one line to make explicit.
      - name: Make sure psql is on PATH
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Console end-to-end
        run: npm run test:e2e:console
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
